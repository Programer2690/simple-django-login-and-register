name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black Check
        run: |
          # Target Python 3.12 syntax directly to avoid the AST parsing warning
          black --check --target-version py312 source/

      - name: Run Flake8
        run: |
          # Check files within the source directory
          flake8 source/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure requirements-dev.txt or requirements.txt is used correctly
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run Migrations
        run: |
          python source/manage.py migrate

      - name: Run Tests
        run: |
          python source/manage.py test source/

  docker:
    name: Build and Push Docker Image
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata (Safe SHA)
        id: meta
        run: |
          echo "SHA_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-auth:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-auth:${{ env.SHA_TAG }} .

      - name: Push Latest
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/django-auth:latest

      - name: Push SHA Tag
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/django-auth:${{ env.SHA_TAG }}